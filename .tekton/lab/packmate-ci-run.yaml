# Create a new Packmate CI PipelineRun with a shared PVC workspace (2Gi).
# Do NOT use Empty Directory — later tasks would not see the clone output.
#
#   oc create -n packmate-lab -f .tekton/lab/packmate-ci-run.yaml
#
# After it Succeeds, promote the validated backend digest to production:
#   RUN=$(oc get pipelinerun -n packmate-lab -l tekton.dev/pipeline=packmate-ci \
#           --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1:].metadata.name}')
#   scripts/promote-backend-image.sh --pipelinerun "$RUN" --namespace packmate-lab --create-pr
#
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: packmate-ci-
  labels:
    app.kubernetes.io/part-of: packmate
    app.kubernetes.io/component: lab-pipeline
spec:
  pipelineRef:
    name: packmate-ci
  taskRunTemplate:
    serviceAccountName: packmate-pipeline
  # Deliberately omit params: bootstrap renders the fork URL, prepared branch,
  # quality threshold, and cluster-resolved tool images as Pipeline defaults.
  # Supplying static values here would override that coordinated live state.
  workspaces:
    - name: source
      volumeClaimTemplate:
        metadata:
          labels:
            app.kubernetes.io/part-of: packmate
        spec:
          accessModes:
            - ReadWriteOnce
          volumeMode: Filesystem
          resources:
            requests:
              storage: 2Gi
